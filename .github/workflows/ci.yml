name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE: asia-southeast2-docker.pkg.dev/dev-agrinas/company-docker/ebitdamax2-be

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  image:
    needs: [vet, test]
    runs-on: ubuntu-latest
    environment: staging-gke
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          buildah build \
            --platform linux/amd64 \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t $IMAGE:latest \
            -t $IMAGE:${GITHUB_SHA} \
            .

      - name: Push image to GCP Artifact Registry
        if: github.event_name == 'push'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" | buildah login -u _json_key --password-stdin asia-southeast2-docker.pkg.dev
          buildah push $IMAGE:latest
          buildah push $IMAGE:${GITHUB_SHA}
