      tags:
      - Meeting Minutes
    put:
      consumes:
      - application/json
      parameters:
      - description: ID Meeting Minutes
        in: path
        name: id
        required: true
        type: integer
      - description: Meeting Minutes dan snapshot item
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.meetingMinutePayload'
