definitions:
  server.additionalFieldPayload:
    properties:
      id:
        type: integer
      input_type:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      options:
        items:
          type: string
        type: array
      show_when:
        type: string
    type: object
  server.costPayload:
    properties:
      machine:
        type: integer
      man:
        type: integer
      material:
        type: integer
      method:
        type: integer
    type: object
  server.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  server.meetingMinuteItemPayload:
    properties:
      action:
        type: string
      date_finish:
        type: string
      date_start:
        type: string
      description:
        type: string
      id:
        type: integer
      objectives:
        type: string
      pic:
        type: string
      remarks:
        type: string
      status:
        type: string
      subject:
        type: string
    type: object
  server.meetingMinutePayload:
    properties:
      attendees:
        type: string
      end_time:
        type: string
      items:
        items:
          $ref: '#/definitions/server.meetingMinuteItemPayload'
        type: array
      location:
        type: string
      meeting_date:
        type: string
      start_time:
        type: string
      title:
        type: string
    type: object
  server.passkeyLoginOptionsRequest:
    properties:
      email:
        type: string
    type: object
  server.regionalAssignmentPayload:
    properties:
      kecamatan:
        type: string
      kota_kabupaten:
        type: string
      provinsi:
        type: string
      scope_level:
        type: string
    type: object
  server.rolePayload:
    properties:
      domain:
        type: string
      level:
        type: string
      name:
        type: string
    type: object
  server.saveKdkmpDailyRequest:
    properties:
      plan_revenue:
        type: string
      variable_cost:
        type: string
    type: object
  server.saveKdkmpTaskSelectionRequest:
    properties:
      selected_task_ids:
        items:
          type: integer
        type: array
    type: object
  server.saveOperationalAttendanceRequest:
    properties:
      operational_attendance:
        additionalProperties:
          type: integer
        type: object
    type: object
  server.taskCategoryPayload:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.taskPayload:
    properties:
      additional_fields:
        items:
          $ref: '#/definitions/server.additionalFieldPayload'
        type: array
      bmc_status:
        type: string
      description:
        type: string
      execution_time:
        type: string
      fixed_cost:
        $ref: '#/definitions/server.costPayload'
      is_active:
        type: boolean
      is_mandatory:
        type: boolean
      lower_time_threshold_minutes:
        type: integer
      name:
        type: string
      period:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      task_category_id:
        type: integer
      time_require:
        type: integer
      upper_time_threshold_minutes:
        type: integer
      variable_cost:
        $ref: '#/definitions/server.costPayload'
    type: object
  server.twoFactorCodeRequest:
    properties:
      code:
        type: string
    type: object
  server.twoFactorEnableRequest:
    properties:
      current_password:
        type: string
    type: object
  server.twoFactorPasswordRequest:
    properties:
      current_password:
        type: string
    type: object
  server.updateMeetingActionItemPayload:
    properties:
      remarks:
        type: string
      status:
        type: string
    type: object
  server.updatePasswordRequest:
    properties:
      current_password:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
    type: object
  server.updateProfileRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  server.userPayload:
    properties:
      domain:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      regional_assignments:
        items:
          $ref: '#/definitions/server.regionalAssignmentPayload'
        type: array
      role_id:
        type: integer
      sdm_kdkmp_entry_id:
        type: integer
    type: object
host: localhost:4000
info:
  contact: {}
  description: REST API aplikasi EBITDA Max APN (refactor Go + Next.js) — scope manager
    KDKMP & superadmin.
  title: EBITDA Max APN API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentikasi dengan email & kata sandi; membuat session cookie `ebitda_session`.
      parameters:
      - description: Kredensial
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Menghapus session di Redis dan cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Mengembalikan user yang sedang login (beserta role).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Profil pengguna saat ini
      tags:
      - Auth
  /api/v1/auth/passkey/login:
    post:
      consumes:
      - application/json
      description: Memverifikasi respons assertion dan membuat session login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Selesaikan login passkey
      tags:
      - Auth
  /api/v1/auth/passkey/options:
    post:
      consumes:
      - application/json
      description: Mengembalikan opsi WebAuthn (publicKey) untuk login passkey berdasarkan
        email; menyimpan challenge di cookie `ebitda_passkey`.
      parameters:
      - description: Email
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.passkeyLoginOptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mulai login passkey
      tags:
      - Auth
  /api/v1/auth/two-factor-challenge:
    post:
      consumes:
      - application/json
      description: Menyelesaikan login yang tertahan 2FA memakai kode TOTP atau recovery
        code.
      parameters:
      - description: Kode TOTP atau recovery code
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.twoFactorCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verifikasi 2FA saat login
      tags:
      - Auth
  /api/v1/kdkmp-dashboard:
    get:
      description: Metrik, financial matrix, dan riwayat harian Manager KDKMP.
      parameters:
      - description: Tanggal matrix (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Halaman riwayat
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Dashboard harian Manager KDKMP
      tags:
      - KDKMP Dashboard
  /api/v1/kdkmp-dashboard/input:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Data input harian Manager KDKMP
      tags:
      - KDKMP Dashboard
  /api/v1/kdkmp-dashboard/today:
    put:
      consumes:
      - application/json
      parameters:
      - description: Input harian
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.saveKdkmpDailyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Simpan input harian KDKMP
      tags:
      - KDKMP Dashboard
  /api/v1/kdkmp-dashboard/today/operational-attendance:
    put:
      consumes:
      - application/json
      parameters:
      - description: Kehadiran operasional
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.saveOperationalAttendanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Simpan kehadiran operasional KDKMP
      tags:
      - KDKMP Dashboard
  /api/v1/kdkmp-dashboard/today/task-selection:
    put:
      consumes:
      - application/json
      parameters:
      - description: Pilihan task
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.saveKdkmpTaskSelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Simpan pilihan task harian KDKMP
      tags:
      - KDKMP Dashboard
  /api/v1/kdkmp-options:
    get:
      description: Daftar data KDKMP untuk dihubungkan ke akun manager (beserta pemilik
        saat ini).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Opsi data KDKMP
      tags:
      - Users
  /api/v1/meeting-minutes:
    get:
      parameters:
      - description: Cari judul, lokasi, atau peserta
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Daftar Meeting Minutes milik Manager KDKMP
      tags:
      - Meeting Minutes
    post:
      consumes:
      - application/json
      parameters:
      - description: Meeting Minutes dan item
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.meetingMinutePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "401":
