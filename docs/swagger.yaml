    post:
      consumes:
      - multipart/form-data
      description: 'Memulai task: unggah foto (wajib), dokumen (opsional), isi field
        tambahan fase mulai, dan alokasi anggota (manager KDKMP).'
      parameters:
      - description: ID task
        in: path
        name: id
        required: true
        type: integer
      - description: Foto mulai (maks 3 MB)
        in: formData
        name: started_photo
        required: true
        type: file
      - collectionFormat: csv
        description: Dokumen pendukung (maks 10 file, 10 MB/file)
        in: formData
        items:
          type: file
        name: documents
        type: array
      - description: 'JSON nilai field tambahan: {\'
        in: formData
        name: values
        type: string
      - description: File field tambahan dengan key value_files[field_name]
        in: formData
        name: value_files
        type: file
      - description: JSON alokasi anggota (manager KDKMP)
        in: formData
        name: member_allocations
        type: string
      - description: true bila manager mengerjakan sendiri
        in: formData
        name: manager_self_assigned
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Mulai task
      tags:
      - Task Reports
